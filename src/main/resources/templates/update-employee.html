<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-warning text-dark py-3">
            <h4 class="mb-0">Edit Employee</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/employees/save}" th:object="${employee}" method="POST">
                <!-- Keep ID hidden so the service knows to update rather than insert -->
                <input type="hidden" th:field="*{id}" />

                <div class="mb-3">
                    <label class="form-label fw-bold">First Name</label>
                    <input type="text" th:field="*{firstName}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Last Name</label>
                    <input type="text" th:field="*{lastName}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Department</label>
                    <input type="text" th:field="*{department}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Salary ($)</label>
                    <input type="number" step="0.01" th:field="*{salary}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary px-4">Update Employee</button>
                    <a th:href="@{/employees}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
