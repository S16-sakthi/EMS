<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">Employee Directory</h2>
    <a th:href="@{/employees/new}" class="btn btn-primary shadow-sm">+ Add Employee</a>
  </div>

  <table class="table table-bordered table-striped table-hover shadow-sm bg-white">
    <thead class="table-dark">
    <tr>
      <th>First Name</th>
      <th>Last Name</th>
      <th>Email</th>
      <th>Department</th>
      <th>Salary ($)</th>
      <th style="width: 180px;">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="emp : ${listEmployees}">
      <td th:text="${emp.firstName}"></td>
      <td th:text="${emp.lastName}"></td>
      <td th:text="${emp.email}"></td>
      <td th:text="${emp.department}"></td>
      <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}"></td>
      <td>
        <a th:href="@{/employees/edit/{id}(id=${emp.id})}" class="btn btn-sm btn-outline-primary me-2">Edit</a>
        <a th:href="@{/employees/delete/{id}(id=${emp.id})}"
           onclick="return confirm('Are you sure you want to delete this employee?');"
           class="btn btn-sm btn-outline-danger">Delete</a>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(listEmployees)}">
      <td colspan="6" class="text-center text-muted py-4">No employees registered yet.</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
