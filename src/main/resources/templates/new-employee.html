<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Add New Employee</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 600px;">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-primary text-white py-3">
      <h4 class="mb-0">Add New Employee</h4>
    </div>
    <div class="card-body p-4">
      <form th:action="@{/employees/save}" th:object="${employee}" method="POST">
        <div class="mb-3">
          <label class="form-label fw-bold">First Name</label>
          <input type="text" th:field="*{firstName}" class="form-control" placeholder="e.g. Alan" />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Last Name</label>
          <input type="text" th:field="*{lastName}" class="form-control" placeholder="e.g. Turing" />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Email Address</label>
          <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. alan@example.com" />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Department</label>
          <input type="text" th:field="*{department}" class="form-control" placeholder="e.g. Research" />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Salary ($)</label>
          <input type="number" step="0.01" th:field="*{salary}" class="form-control" placeholder="e.g. 85000.00" />
          <div class="text-danger small mt-1" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-success px-4">Save Employee</button>
          <a th:href="@{/employees}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
